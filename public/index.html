        <!-- Floating WhatsApp Button Styles -->
        <style>
            .whatsapp-float {
                position: fixed;
                width: 60px;
                height: 60px;
                bottom: 30px;
                right: 30px;
                background-color: #25d366;
                color: #FFF;
                border-radius: 50px;
                text-align: center;
                font-size: 30px;
                box-shadow: 2px 2px 15px rgba(0, 0, 0, 0.3);
                z-index: 9999;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: all 0.3s ease;
                animation: glow 2s ease-in-out infinite;
            }

            .whatsapp-float:hover {
                transform: scale(1.1);
                box-shadow: 2px 2px 25px rgba(37, 211, 102, 0.8);
            }

            @keyframes glow {
                0%, 100% {
                    box-shadow: 0 0 20px rgba(37, 211, 102, 0.6),
                                0 0 30px rgba(37, 211, 102, 0.4),
                                0 0 40px rgba(37, 211, 102, 0.2);
                }
                50% {
                    box-shadow: 0 0 30px rgba(37, 211, 102, 0.8),
                                0 0 40px rgba(37, 211, 102, 0.6),
                                0 0 50px rgba(37, 211, 102, 0.4);
                }
            }

            .whatsapp-float svg {
                width: 35px;
                height: 35px;
            }
        </style>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

        <!-- Hidden Netlify Forms for Detection (DO NOT REMOVE) -->
        <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
            <input type="email" name="email" />
        </form>
        <form name="property-inquiry" netlify netlify-honeypot="bot-field" hidden>
            <input type="hidden" name="form-name" value="property-inquiry" />
            <input type="text" name="property" />
            <input type="text" name="name" />
            <input type="email" name="email" />
            <input type="tel" name="phone" />
            <textarea name="message"></textarea>
            <input type="text" name="bot-field" />
        </form>
        <form name="contact" netlify netlify-honeypot="bot-field" hidden>
            <input type="hidden" name="form-name" value="contact" />
            <input type="text" name="name" />
            <input type="email" name="email" />
            <input type="tel" name="phone" />
            <input type="text" name="subject" />
            <textarea name="message"></textarea>
            <input type="text" name="bot-field" />
        </form>

        <form name="valuation" netlify netlify-honeypot="bot-field" hidden>
            <input type="hidden" name="form-name" value="valuation" />
            <input type="text" name="name" />
            <input type="email" name="email" />
            <input type="tel" name="phone" />
            <input type="text" name="propertyType" />
            <input type="text" name="address" />
            <input type="number" name="bedrooms" />
            <input type="number" name="bathrooms" />
            <input type="number" name="area" />
            <input type="number" name="yearBuilt" />
            <textarea name="additionalInfo"></textarea>
            <input type="text" name="bot-field" />
        </form>
